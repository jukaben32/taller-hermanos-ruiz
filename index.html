    <!-- Extension Compatibility & Error Shielding -->
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension:') !== -1) ||
            (event.message && (
              event.message.indexOf('fetch') !== -1 ||
              event.message.indexOf('MetaMask') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = (event.reason && (event.reason.stack || event.reason.message || event.reason)) || '';
          if (
            typeof reasonStr === 'string' &&
            (reasonStr.indexOf('chrome-extension:') !== -1 ||
             reasonStr.indexOf('MetaMask') !== -1 ||
             reasonStr.indexOf('fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
